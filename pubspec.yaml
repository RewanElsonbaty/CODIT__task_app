name: codit
description: Business operations app — approvals, installments, gold sales, branch monitoring.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  json_annotation: ^4.12.0
  get_it: ^9.3.0
  dio: ^5.8.0+1
  go_router: ^18.1.4
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^23.0.0
  app_links: ^7.2.0
  intl: ^0.20.2
  decimal: ^3.2.1
  talker_flutter: ^5.2.0
  talker_dio_logger: ^5.2.0
  uuid: ^4.5.1
  collection: ^1.19.1
  # Auth System Dependencies
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  device_info_plus: ^13.3.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  timeago: ^3.6.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  drift_dev: ^2.26.0
  mocktail: ^1.0.0
  bloc_test: ^10.0.0
  # Code Generation for Auth System
  freezed: ^4.0.3

flutter:
  uses-material-design: true
  generate: true
  
  # الخطوط: Cairo للعربية
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-ExtraBold.ttf
          weight: 800
